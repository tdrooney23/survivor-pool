<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>March Madness Survivor Pool 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --bright-blue: #1d5bbf;
    --accent: #4a90d9;
    --light-blue: #6fb3f5;
    --white: #ffffff;
    --gray: #8aa0bc;
    --dark-card: #0f1f3d;
    --card-border: #1e3a6e;
    --cbs: #0033a0;
    --tnt: #c8440a;
    --tbs: #007eb8;
    --trutv: #7a28b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(29,91,191,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(74,144,217,0.1) 0%, transparent 50%),
      repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(255,255,255,0.012) 40px, rgba(255,255,255,0.012) 41px);
  }
  header { text-align:center; padding:28px 20px 12px; }
  .mm-logo { height:72px; object-fit:contain; filter:drop-shadow(0 4px 20px rgba(74,144,217,0.5)); }
  .pool-title {
    font-family:'Barlow Condensed',sans-serif;
    font-size:13px; font-weight:700; letter-spacing:4px;
    text-transform:uppercase; color:var(--light-blue); margin-top:6px;
  }
  .stats-bar {
    display:flex; justify-content:center; gap:32px;
    padding:12px 20px 16px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:13px; color:var(--gray); letter-spacing:1px;
  }
  .stats-bar span { color:var(--light-blue); font-weight:700; margin-left:4px; }
  .day-divider {
    font-family:'Barlow Condensed',sans-serif;
    font-size:11px; font-weight:700; letter-spacing:3px;
    text-transform:uppercase; color:var(--gray);
    display:flex; align-items:center; gap:12px;
    max-width:1400px; margin:8px auto 0; padding:0 20px;
  }
  .day-divider::before,.day-divider::after {
    content:''; flex:1; height:1px; background:var(--card-border);
  }
  .games-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));
    gap:14px; padding:12px 20px 24px;
    max-width:1400px; margin:0 auto;
  }
  .game-card {
    background:var(--dark-card);
    border:1px solid var(--card-border);
    border-radius:8px; overflow:hidden;
    transition:transform 0.2s, box-shadow 0.2s;
    animation:fadeUp 0.4s ease both;
    display:flex; flex-direction:column;
  }
  .game-card.card-won { border:2px solid #22c55e; }
  .game-card.card-lost { border:2px solid #ef4444; }
  .game-card:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(29,91,191,0.3); }
  .picker-chip.chip-won { background:rgba(34,197,94,0.15); border-color:rgba(34,197,94,0.4); color:#22c55e; }
  .picker-chip.chip-elim { background:rgba(239,68,68,0.15); border-color:rgba(239,68,68,0.4); color:#ef4444; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-20px)} }


  .network-badge {
    font-family:'Barlow Condensed',sans-serif;
    font-size:10px; font-weight:800; letter-spacing:1px;
    padding:2px 7px; border-radius:3px; text-transform:uppercase;
  }
  /* CARD BODY: logo left, pickers right */
  .card-body {
    display:flex; align-items:stretch;
    padding:14px 14px 12px; gap:14px;
  }
  .logo-block {
    display:flex; flex-direction:column; align-items:center;
    flex-shrink:0; width:84px;
  }
  .team-seed {
    font-family:'Barlow Condensed',sans-serif;
    font-size:9px; font-weight:700; color:var(--gray);
    letter-spacing:1px; margin-bottom:3px; text-transform:uppercase;
  }
  .team-logo {
    width:72px; height:72px; object-fit:contain;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,0.6));
  }
  .team-logo-placeholder {
    width:72px; height:72px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.07); border-radius:50%;
    font-family:'Barlow Condensed',sans-serif;
    font-size:10px; font-weight:700; color:var(--gray);
    text-align:center; line-height:1.2; padding:6px;
  }
  .team-name {
    font-family:'Barlow Condensed',sans-serif;
    font-size:12px; font-weight:800; text-transform:uppercase;
    letter-spacing:0.5px; text-align:center;
    color:var(--white); margin-top:5px;
  }
  .card-divider {
    width:1px; background:var(--card-border); flex-shrink:0; align-self:stretch;
  }
  /* PICKERS */
  .pickers-section {
    flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center;
  }
  .pickers-label {
    font-family:'Barlow Condensed',sans-serif;
    font-size:10px; font-weight:700; letter-spacing:2px;
    color:var(--gray); text-transform:uppercase; margin-bottom:5px;
  }
  .picker-chips { display:flex; flex-wrap:wrap; gap:4px; }
  .picker-chip {
    background:rgba(74,144,217,0.15);
    border:1px solid rgba(74,144,217,0.28);
    color:var(--light-blue);
    font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:20px;
    white-space:nowrap;
  }

  /* FOOTER: VS opponent left · time + network right */
  .card-footer {
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:6px 12px 8px;
    border-top:1px solid rgba(255,255,255,0.06);
  }
  .vs-info {
    font-family:'Barlow Condensed',sans-serif;
    font-size:11px; font-weight:700; color:var(--gray);
    text-transform:uppercase; letter-spacing:0.5px;
  }
  .vs-info em { color:var(--accent); font-style:normal; margin-right:5px; }
  .footer-right { display:flex; align-items:center; gap:8px; }
  .game-time {
    font-family:'Barlow Condensed',sans-serif;
    font-size:11px; font-weight:700; letter-spacing:1px;
    color:var(--gray); text-transform:uppercase;
  }
  .net-CBS  { background:var(--cbs);   color:#fff; }
  .net-TNT  { background:var(--tnt);   color:#fff; }
  .net-TBS  { background:var(--tbs);   color:#fff; }
  .net-truTV{ background:var(--trutv); color:#fff; }

  #venmo-modal { display:none; }
  #venmo-modal.open { display:flex !important; }
  .pay-btn {
    font-family:'Barlow Condensed',sans-serif;
    font-size:11px; font-weight:800; letter-spacing:1.5px;
    text-transform:uppercase; padding:4px 12px; border-radius:20px;
    cursor:pointer; border:1px solid rgba(74,144,217,0.4);
    background:rgba(74,144,217,0.12); color:#6fb3f5;
    transition:all 0.18s; white-space:nowrap;
  }
  .pay-btn:hover { background:rgba(74,144,217,0.25); }
  .pay-btn.paid {
    background:rgba(34,197,94,0.12); border-color:rgba(34,197,94,0.35);
    color:#22c55e; cursor:default; pointer-events:none;
  }
  .pay-btn.unpaid {
    background:rgba(239,68,68,0.12); border-color:rgba(239,68,68,0.35);
    color:#ef4444;
  }
  .pay-btn.unpaid:hover { background:rgba(239,68,68,0.25); }
  footer { text-align:center; padding:16px; color:rgba(255,255,255,0.18); font-size:11px; letter-spacing:1px; }

  /* ── LIVE BAR ── */
  .live-bar {
    display:flex; align-items:center; justify-content:center;
    gap:10px; padding:6px 20px 14px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:12px; color:var(--gray); letter-spacing:1px;
    text-transform:uppercase;
  }
  .live-dot {
    width:8px; height:8px; border-radius:50%;
    background:var(--gray); flex-shrink:0;
    transition:background 0.3s;
  }
  .live-dot.live { background:#22c55e; animation:pulse 2s infinite; }
  .live-dot.error { background:#ef4444; }
  @keyframes pulse {
    0%,100%{opacity:1} 50%{opacity:0.4}
  }
  .refresh-btn {
    background:rgba(74,144,217,0.15); border:1px solid rgba(74,144,217,0.3);
    color:var(--light-blue); padding:3px 12px; border-radius:20px;
    font-family:'Barlow Condensed',sans-serif; font-size:12px;
    font-weight:700; letter-spacing:1px; cursor:pointer;
    transition:all 0.18s; text-transform:uppercase;
  }
  .refresh-btn:hover { background:rgba(74,144,217,0.3); }
  .refresh-btn:disabled { opacity:0.4; cursor:default; }

  /* ── TABS ── */
  .tab-nav { display:flex; justify-content:center; gap:6px; padding:0 20px 16px; }
  .tab-btn {
    background:var(--dark-card); border:1px solid var(--card-border);
    color:var(--gray); padding:8px 28px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:13px; font-weight:700; letter-spacing:2px;
    text-transform:uppercase; cursor:pointer; border-radius:3px;
    transition:all 0.18s;
  }
  .tab-btn:hover { border-color:var(--accent); color:var(--white); }
  .tab-btn.active { background:var(--bright-blue); border-color:var(--bright-blue); color:#fff; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* ── PARTICIPANTS GRID ── */
  .participants-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));
    gap:12px; padding:12px 20px 40px;
    max-width:1400px; margin:0 auto;
  }
  .participant-card {
    background:var(--dark-card); border:1px solid var(--card-border);
    border-radius:8px; padding:14px 14px 12px;
    animation:fadeUp 0.4s ease both;
    transition:transform 0.18s, box-shadow 0.18s;
  }
  .participant-card:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(29,91,191,0.25); }
  .participant-card.eliminated { opacity:0.5; border-color:rgba(239,68,68,0.3); }
  .participant-name {
    font-family:'Barlow Condensed',sans-serif;
    font-size:15px; font-weight:800; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--white);
    margin-bottom:12px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .pick-circles { display:flex; gap:12px; align-items:flex-start; }
  .pick-slot { display:flex; flex-direction:column; align-items:center; }
  .pick-circle {
    position:relative; flex-shrink:0;
    width:64px; height:64px; border-radius:50%;
    border:2px solid var(--card-border);
    background:rgba(255,255,255,0.04);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; transition:border-color 0.3s, box-shadow 0.3s;
  }
  .pick-circle img { width:52px; height:52px; object-fit:contain; }
  .pick-circle .circle-placeholder {
    font-family:'Barlow Condensed',sans-serif;
    font-size:9px; font-weight:700; color:var(--gray);
    text-align:center; line-height:1.2; padding:4px;
  }
  .pick-circle.won { border-color:#22c55e; box-shadow:0 0 10px rgba(34,197,94,0.4); }
  .pick-circle.lost { border-color:#ef4444; box-shadow:0 0 8px rgba(239,68,68,0.25); }
  .pick-circle.lost::after {
    content:''; position:absolute; inset:0;
    background:rgba(239,68,68,0.35); border-radius:50%;
  }
  .pick-circle.lost::before {
    content:'✕'; position:absolute; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:900; color:rgba(255,80,80,0.95);
  }
  .pick-label {
    font-family:'Barlow Condensed',sans-serif;
    font-size:9px; font-weight:700; color:var(--gray);
    text-align:center; text-transform:uppercase;
    margin-top:4px; letter-spacing:0.5px;
    width:64px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .participant-status {
    font-family:'Barlow Condensed',sans-serif;
    font-size:10px; color:var(--gray); letter-spacing:1px;
    margin-top:10px; text-transform:uppercase; display:flex; align-items:center; gap:5px;
  }
  .status-dot { width:7px; height:7px; border-radius:50%; background:var(--gray); flex-shrink:0; }
  .status-dot.alive { background:#22c55e; }
  .status-dot.elim { background:#ef4444; }

  /* ── TERMINATORS TAB ── */
  .terminators-header {
    display:flex; align-items:center; justify-content:center; gap:16px;
    padding:24px 20px 8px; max-width:900px; margin:0 auto;
  }
  .terminators-header img { height:60px; border-radius:6px; }
  .terminators-header h2 {
    font-family:'Barlow Condensed',sans-serif; font-size:28px;
    font-weight:800; color:#ef4444; text-transform:uppercase; letter-spacing:2px; margin:0;
  }
  .terminators-list {
    max-width:900px; margin:0 auto; padding:12px 20px 40px;
    display:flex; flex-direction:column; gap:10px;
  }
  .terminator-card {
    background:var(--dark-card); border:1px solid var(--card-border);
    border-radius:8px; padding:14px 18px;
    display:flex; align-items:center; gap:16px;
    animation:fadeUp 0.4s ease both;
  }
  .terminator-rank {
    font-family:'Barlow Condensed',sans-serif; font-size:28px;
    font-weight:800; color:#ef4444; min-width:32px; text-align:center;
  }
  .terminator-logo { width:48px; height:48px; object-fit:contain; }
  .terminator-info { flex:1; }
  .terminator-team {
    font-family:'Barlow Condensed',sans-serif; font-size:20px;
    font-weight:700; color:#fff; text-transform:uppercase;
  }
  .terminator-detail { font-size:12px; color:#8aa0bc; margin-top:2px; }
  .terminator-kills {
    font-family:'Barlow Condensed',sans-serif; font-size:32px;
    font-weight:800; color:#ef4444; text-align:center; min-width:50px; line-height:1;
  }
  .terminator-kills-label {
    font-size:9px; color:#ef4444; text-transform:uppercase;
    letter-spacing:1px; font-weight:700; text-align:center;
  }
</style>
</head>
<body>
<header>
  <img class="mm-logo" id="mmlogo" alt="March Madness">
  <div class="pool-title">2026 Survivor Pool &mdash; Round of 64</div>
</header>
<div id="loader" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;">
  <div style="font-size:48px;animation:bounce 0.6s ease infinite alternate;">🏀</div>
  <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8aa0bc;margin-top:12px;">Loading pool data...</div>
</div>
<div id="main-content" style="display:none;">
<div class="stats-bar" id="stats"></div>
<div class="live-bar" id="live-bar">
  <span class="live-dot" id="live-dot"></span>
  <span id="live-status">Connecting to live scores...</span>
  <button class="refresh-btn" onclick="fetchScores(true)">↻ Refresh</button>
</div>
<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('games',this)">Round of 64</button>
  <button class="tab-btn" onclick="switchTab('participants',this)">Participants</button>
  <button class="tab-btn" onclick="switchTab('terminators',this)">Top Terminators</button>
</div>
<div id="games" class="tab-panel active">
  <div id="app"></div>
</div>
<div id="participants" class="tab-panel">
  <div style="max-width:1400px;margin:0 auto;padding:12px 20px 0;">
    <input id="participant-search" type="text" placeholder="Search by name..." oninput="renderParticipants()" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--card-border);background:var(--dark-card);color:#fff;font-size:14px;outline:none;box-sizing:border-box;">
  </div>
  <div id="participants-grid" class="participants-grid"></div>
</div>
<div id="terminators" class="tab-panel">
  <div id="terminators-content"></div>
</div>
</div>
<footer>SURVIVOR POOL 2026 &middot; MARCH MADNESS</footer>

// Normalize team names from sheet to match schedule
const teamNameMap = {};
schedule.forEach(g => {
  teamNameMap[g.team1.toLowerCase()] = g.team1;
  teamNameMap[g.team1.toLowerCase().replace(/[.']/g, '')] = g.team1;
  if (typeof g.team2 === 'string' && g.team2 !== 'TBD') {
    teamNameMap[g.team2.toLowerCase()] = g.team2;
    teamNameMap[g.team2.toLowerCase().replace(/[.']/g, '')] = g.team2;
  }
});
function normalizeTeam(t) {
  if (!t) return '';
  return teamNameMap[t.toLowerCase().replace(/[.']/g, '').trim()]
      || teamNameMap[t.toLowerCase().trim()]
      || t;
}

function isAliveAfterR64(name) {
  const picks = r64Picks[name];
  if (!picks) return false;
  return picks.every(t => r64Results[t] === 'won');
}

function buildFromData(participants, r32picks, paid) {
  allParticipants = participants;

  // Build picksMap from R32 picks (1 pick per participant)
  picksMap = {};
  r32picks.forEach(([n, t]) => {
    if (n && t) picksMap[n] = [normalizeTeam(t)];
  });

  // Rebuild paidList from sheet
  paidList.clear();
  paid.forEach(name => { if (name) paidList.add(name); });

  // Rebuild teamPickers from R32 picks
  teamPickers = {};
  allParticipants.forEach(name => {
    (picksMap[name] || []).forEach(t => {
      if (!teamPickers[t]) teamPickers[t] = [];
      teamPickers[t].push(name);
    });
  });
}

async function fetchSheetData() {
  if (!SHEET_URL) {
    // No sheet URL yet — use hardcoded data
    buildFromData(allParticipants, rawPicks, []);
    return;
  }
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error('Sheet fetch failed');
    const data = await res.json();
    buildFromData(data.participants, data.picks, data.paid);
    render();
    renderParticipants();
    renderTerminators();
  } catch(err) {
    console.warn('Sheet fetch error, using hardcoded data:', err);
    buildFromData(allParticipants, rawPicks, []);
  }
  document.getElementById('loader').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
}

function netClass(net) {
  if (net==='CBS') return 'net-CBS';
  if (net==='TNT') return 'net-TNT';
  if (net==='TBS') return 'net-TBS';
  return 'net-truTV';
}

function logoEl(team) {
  if (LOGOS[team]) return `<img class="team-logo" src="${LOGOS[team]}" alt="${team}">`;
  return `<div class="team-logo-placeholder">${team}</div>`;
}

function render() {
  document.getElementById('mmlogo').src = LOGOS['__mm__'];

  // Build card entries for both sides of each game
  function buildCards(day) {
    const cards = [];
    schedule.filter(g => g.day === day).forEach(g => {
      if ((teamPickers[g.team1]||[]).length > 0) {
        const oppLabel = typeof g.seed2==='number' ? `(${g.seed2}) ${g.team2}` : g.team2;
        cards.push({ team: g.team1, seed: g.seed1, opp: oppLabel, time: g.time, net: g.net });
      }
      if (typeof g.seed2==='number' && (teamPickers[g.team2]||[]).length > 0) {
        cards.push({ team: g.team2, seed: g.seed2, opp: `(${g.seed1}) ${g.team1}`, time: g.time, net: g.net });
      }
    });
    return cards;
  }

  // Build set of participants who have any loss
  const elimSet = new Set();
  // Build set of participants who have at least one win (and no loss)
  const wonSet = new Set();
  allParticipants.forEach(name => {
    const [t1, t2] = picksMap[name] || [];
    const hasLoss = (t1 && results[t1] === 'lost') || (t2 && results[t2] === 'lost');
    const hasWin = (t1 && results[t1] === 'won') || (t2 && results[t2] === 'won');
    if (hasLoss) elimSet.add(name);
    else if (hasWin) wonSet.add(name);
  });

  function chipClass(name) {
    if (elimSet.has(name)) return 'picker-chip chip-elim';
    if (wonSet.has(name)) return 'picker-chip chip-won';
    return 'picker-chip';
  }

  const thu = buildCards('THU');
  const fri = buildCards('FRI');

  // Sort: completed games to the end
  function sortCards(cards) {
    return cards.sort((a, b) => {
      const aDone = results[a.team] === 'won' || results[a.team] === 'lost' ? 1 : 0;
      const bDone = results[b.team] === 'won' || results[b.team] === 'lost' ? 1 : 0;
      return aDone - bDone;
    });
  }
  sortCards(thu);
  sortCards(fri);

  let html = '';
  let idx = 0;

  function renderGroup(cards, label) {
    if (!cards.length) return;
    html += `<div class="day-divider">${label}</div><div class="games-grid">`;
    cards.forEach(c => {
      const pickers = teamPickers[c.team] || [];
      const chips = pickers.map(p=>`<span class="${chipClass(p)}">${p}</span>`).join('');
      const r = results[c.team];
      const cardClass = r === 'won' ? 'card-won' : r === 'lost' ? 'card-lost' : '';
      html += `
      <div class="game-card ${cardClass}" data-team="${c.team}" style="animation-delay:${idx*35}ms">
        <div class="card-body">
          <div class="logo-block">
            <div class="team-seed">SEED ${c.seed}</div>
            ${logoEl(c.team)}
            <div class="team-name">${c.team}</div>
          </div>
          <div class="card-divider"></div>
          <div class="pickers-section">
            <div class="pickers-label">Picked by (${pickers.length})</div>
            <div class="picker-chips">${chips}</div>
          </div>
        </div>
        <div class="card-footer">
          <div class="vs-info"><em>VS</em>${c.opp}<span class="score-area" data-team="${c.team}">${scoreHTML(c.team)}</span></div>
          <div class="footer-right">
            <span class="game-time">${c.time}</span>
            <span class="network-badge ${netClass(c.net)}">${c.net}</span>
          </div>
        </div>
      </div>`;
      idx++;
    });
    html += '</div>';
  }

  // Not picked yet banner
  const notPicked = allParticipants.filter(n => {
    const [t1, t2] = picksMap[n] || [];
    return !t1 || !t2;
  });
  let bannerHtml = '';
  if (notPicked.length > 0) {
    const chips = notPicked.map(n => `<span class="picker-chip" style="border-color:rgba(239,180,0,0.3);background:rgba(239,180,0,0.08);color:#f0b400;">${n}</span>`).join('');
    bannerHtml = `
    <div style="max-width:1400px;margin:0 auto;padding:0 20px 16px;">
      <div style="background:#0f1f3d;border:1px solid rgba(239,180,0,0.25);border-radius:8px;padding:12px 16px;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#f0b400;margin-bottom:8px;">

        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;">${chips}</div>
      </div>

    // Merge saved data into current objects (saved data fills in gaps, doesn't overwrite seed)
    Object.keys(saved).forEach(k => { if (!results[k]) results[k] = saved[k]; });

      if (!gameScores[k] || gameScores[k].state !== 'post') {
        if (savedScores[k]?.state === 'post') gameScores[k] = savedScores[k];
      }
    });
  } catch(e) {}
}

const TERMINATOR_IMG = 'https://giecdn.blob.core.windows.net/fileuploads/image/2019/10/22/terminator.jpg';

function renderTerminators() {
  // Collect individual game wins that eliminated pool participants
  const gameWins = [];
  schedule.forEach(g => {
    if (results[g.team1] === 'won' && typeof g.seed2 === 'number') {
      const victims = teamPickers[g.team2] || [];
      if (victims.length > 0) {
        const s = gameScores[g.team1];
        gameWins.push({
          team: g.team1, seed: g.seed1,
          loser: g.team2, loserSeed: g.seed2,
          score: s ? `${s.score1}–${s.score2}` : '',
          kills: victims.length, round: 'Round of 64',
          victims,
        });
      }
    }
    if (typeof g.seed2 === 'number' && results[g.team2] === 'won') {
      const victims = teamPickers[g.team1] || [];
      if (victims.length > 0) {
        const s = gameScores[g.team2];
        gameWins.push({
          team: g.team2, seed: g.seed2,
          loser: g.team1, loserSeed: g.seed1,
          score: s ? `${s.score1}–${s.score2}` : '',
          kills: victims.length, round: 'Round of 64',
          victims,
        });
      }
    }
  });

  // Aggregate by team
  const teamMap = {};
  gameWins.forEach(w => {
    if (!teamMap[w.team]) {
      teamMap[w.team] = { team: w.team, seed: w.seed, totalKills: 0, games: [] };
    }
    teamMap[w.team].totalKills += w.kills;
    teamMap[w.team].games.push(w);
  });

  const terminators = Object.values(teamMap).sort((a, b) => b.totalKills - a.totalKills);
  const totalElim = terminators.reduce((sum, t) => sum + t.totalKills, 0);

  let html = `
    <div class="terminators-header">
      <img src="${TERMINATOR_IMG}" alt="Terminator">
      <div>
        <h2>Top Terminators</h2>
        <div style="color:#8aa0bc;font-size:13px;text-align:center;">
          <span style="color:#ef4444;font-weight:800;font-size:18px;">${totalElim}</span> total eliminated
        </div>
      </div>
      <img src="${TERMINATOR_IMG}" alt="Terminator">
    </div>`;

  if (terminators.length === 0) {
    html += `<div style="text-align:center;color:#8aa0bc;padding:40px 20px;font-size:16px;">No terminations yet. Games are still in progress...</div>`;
  } else {
    html += '<div class="terminators-list">';
    terminators.forEach((t, i) => {
      const logoSrc = LOGOS[t.team];
      const logoHtml = logoSrc
        ? `<img class="terminator-logo" src="${logoSrc}" alt="${t.team}">`
        : `<div class="terminator-logo" style="display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px;">${t.team}</div>`;

      // Build game-by-game breakdown
      const gamesHtml = t.games.map(g => {
        const victimChips = g.victims.map(v =>
          `<span style="font-size:10px;color:#ef4444;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);padding:1px 6px;border-radius:10px;white-space:nowrap;">${v}</span>`
        ).join(' ');
        return `
          <div style="margin-top:8px;">
            <div class="terminator-detail">${g.round} · beat (${g.loserSeed}) ${g.loser} · ${g.score} FINAL — <span style="color:#ef4444;font-weight:700;">${g.kills} eliminated</span></div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">${victimChips}</div>
          </div>`;
      }).join('');

      html += `
        <div class="terminator-card" style="animation-delay:${i * 50}ms;align-items:flex-start;">
          <div class="terminator-rank">#${i + 1}</div>
          ${logoHtml}
          <div class="terminator-info">
            <div class="terminator-team">(${t.seed}) ${t.team}</div>
            ${gamesHtml}
          </div>
          <div style="padding-top:4px;">
            <div class="terminator-kills">${t.totalKills}</div>
            <div class="terminator-kills-label">total</div>
          </div>
        </div>`;
    });
    html += '</div>';
  }

  document.getElementById('terminators-content').innerHTML = html;
}

function renderParticipants() {
  const grid = document.getElementById('participants-grid');

  // Filter by search
  const query = (document.getElementById('participant-search')?.value || '').toLowerCase();
  const filtered = allParticipants.filter(n => !query || n.toLowerCase().includes(query));

  // Sort: alive first, then alphabetical
  const sorted = filtered.sort((a, b) => {
    const aElim = isEliminated(a);
    const bElim = isEliminated(b);
    if (aElim !== bElim) return aElim ? 1 : -1;
    return a.localeCompare(b);
  });

  grid.innerHTML = sorted.map((name, i) => {
    const [t1, t2] = picksMap[name] || ['', ''];
    const r1 = results[t1] || null;
    const r2 = results[t2] || null;
    const elim = isEliminated(name);

    // R64 pick states
    function r64State(team, result) {
      if (!team) return 'nopick';
      if (result === 'won') return 'won';
      if (result === 'lost') return 'lost';
      return 'pending'; // has pick, game not played yet — show logo
    }

    // Future round states: if eliminated, show 'elim'; otherwise 'locked'
    const futureState = elim ? 'elim' : 'locked';

    const paid = paidList.has(name);
    const onclickAttr = paid ? '' : `onclick="openVenmo('${name.replace(/'/g, "\\'")}')"`;
    return `
    <div class="participant-card${elim ? ' eliminated' : ''}" style="animation-delay:${i*20}ms">
      <div class="participant-name" ${!paid ? 'style="color:#ef4444;"' : ''}>${name}</div>
      <div class="pick-circles" style="display:flex;align-items:flex-start;gap:4px;flex-wrap:nowrap;justify-content:space-between;">
        ${makeCircle(t1, r64State(t1, r1), 'R64', true)}
        ${makeCircle(t2, r64State(t2, r2), 'R64', true)}
        <div style="width:1px;height:38px;background:#1e2d45;margin:0 2px;flex-shrink:0;"></div>
        ${makeCircle('', futureState, 'R32', false)}
        ${makeCircle('', futureState, 'S16', false)}
        ${makeCircle('', futureState, 'E8', false)}
        ${makeCircle('', futureState, 'F4', false)}
        ${makeCircle('', futureState, 'CHMP', false)}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
        <div class="participant-status">
          <div class="status-dot ${elim ? 'elim' : 'alive'}"></div>
          ${elim ? 'Eliminated' : 'Alive'}
        </div>
        <button class="pay-btn ${paid ? 'paid' : 'unpaid'}" ${onclickAttr}>${paid ? 'Paid' : 'Pay'}</button>
      </div>
    </div>`;
  }).join('');
}

function isEliminated(name) {
  const [t1, t2] = picksMap[name] || [];
  return results[t1] === 'lost' || results[t2] === 'lost';
}

// circle states: 'won', 'lost', 'pending', 'nopick', 'locked', 'elim'
function makeCircle(team, state, label, showLogo) {
  let border, bg, inner;
  const circleLogo = CIRCLE_LOGOS[team] || LOGOS[team];

  if (state === 'pending') {
    // Has pick, game not played yet — show logo with neutral border
    border = '2px solid #3b82f6';
    bg = 'rgba(59,130,246,0.08)';
    inner = circleLogo
      ? `<img src="${circleLogo}" alt="${team}" style="width:28px;height:28px;object-fit:contain;">`
      : `<div style="font-size:7px;font-weight:800;color:#fff;text-align:center;">${team.substring(0,4).toUpperCase()}</div>`;
  } else if (state === 'won') {
    border = '2px solid #22c55e';
    bg = 'rgba(34,197,94,0.08)';
    inner = circleLogo
      ? `<img src="${circleLogo}" alt="${team}" style="width:28px;height:28px;object-fit:contain;">`
      : `<div style="font-size:7px;font-weight:800;color:#fff;text-align:center;">${team.substring(0,4).toUpperCase()}</div>`;
  } else if (state === 'lost') {
    border = '2px solid #ef4444';
    bg = 'rgba(239,68,68,0.10)';
    const logo = circleLogo
      ? `<img src="${circleLogo}" alt="${team}" style="width:28px;height:28px;object-fit:contain;opacity:0.3;">`
      : `<div style="font-size:7px;font-weight:800;color:rgba(255,255,255,0.3);text-align:center;">${team.substring(0,4).toUpperCase()}</div>`;
    inner = logo + `<div style="position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:rgba(239,68,68,0.9);">X</div>`;
  } else if (state === 'elim') {
    // Eliminated future round - empty red X no logo
    border = '2px solid #ef4444';
    bg = 'rgba(239,68,68,0.08)';
    inner = `<div style="font-size:22px;font-weight:900;color:rgba(239,68,68,0.7);">X</div>`;
  } else if (state === 'nopick') {
    border = '2px dashed #2a3a5a';
    bg = 'transparent';
    inner = `<div style="font-size:8px;font-weight:700;color:#2a4a6a;text-align:center;line-height:1.2;">NO<br>PICK</div>`;
  } else {
    // locked - not open yet
    border = '1px solid #151f35';
    bg = 'rgba(255,255,255,0.015)';
    inner = `<div style="font-size:11px;font-weight:700;color:#1e2d45;">—</div>`;
  }

  const labelColor = state === 'won' ? '#22c55e'
    : (state === 'lost' || state === 'elim') ? '#ef4444'
    : state === 'pending' ? '#3b82f6'
    : state === 'nopick' ? '#2a4a6a'
    : '#1e2d45';

  return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;">
    <div style="position:relative;width:38px;height:38px;border-radius:50%;border:${border};background:${bg};display:flex;align-items:center;justify-content:center;overflow:hidden;">${inner}</div>
    <div style="font-size:8px;font-weight:700;color:${labelColor};letter-spacing:0.5px;text-transform:uppercase;">${label}</div>
  </div>`;
}

function pickCircleHTML(team, result) {
  // Legacy wrapper - kept for compatibility
  const state = result === 'won' ? 'won' : result === 'lost' ? 'lost' : 'nopick';
  return makeCircle(team, state, 'R64', true);
}

// ── SCORE DISPLAY ─────────────────────────────────────────────
function scoreHTML(team) {
  const s = gameScores[team];
  if (!s || s.state === 'pre') return '';

  const sep = '<span style="color:#475569;font-size:11px;margin:0 2px;">·</span>';

  if (s.state === 'in') {
    const winning = s.score1 > s.score2;
    const losing  = s.score1 < s.score2;
    const s1color = winning ? '#22c55e' : losing ? '#ef4444' : '#8aa0bc';
    return ` ${sep}
      <span style="color:${s1color};font-size:13px;font-weight:800;">${s.score1}</span>
      <span style="color:#475569;font-size:11px;">–</span>
      <span style="color:#8aa0bc;font-size:13px;">${s.score2}</span>
      <span style="color:#475569;font-size:10px;margin-left:3px;">${s.clock} ${s.period}</span>`;
  }

  if (s.state === 'post') {
    const won = results[team] === 'won';
    const letter = won
      ? '<span style="color:#22c55e;font-size:12px;font-weight:800;margin-right:3px;">W</span>'
      : '<span style="color:#ef4444;font-size:12px;font-weight:800;margin-right:3px;">L</span>';
    return ` ${sep} ${letter}
      <span style="color:#8aa0bc;font-size:13px;font-weight:700;">${s.score1} – ${s.score2}</span>
      <span style="color:#475569;font-size:10px;margin-left:3px;">FINAL</span>`;
  }
  return '';
}

async function fetchScores(manual = false) {
  const btn = document.querySelector('.refresh-btn');
  if (btn) btn.disabled = true;
  if (manual) setLiveStatus('', 'Refreshing...');

  try {
    const url = '/api/scores';
    const res = await fetch(url);
    if (!res.ok) throw new Error('ESPN API error');
    const data = await res.json();

    let scoresChanged = false;
    let resultsChanged = false;
    const events = data.events || [];

    events.forEach(event => {
      const comp = event.competitions?.[0];
      if (!comp) return;
      const statusType = comp.status?.type;
      const state = statusType?.state || 'pre'; // 'pre', 'in', 'post'
      const isFinished = statusType?.completed === true;
      const clock = comp.status?.displayClock || '';
      const period = comp.status?.period
        ? (comp.status.period <= 2 ? `${comp.status.period}H` : `OT`)
        : '';

      // Find our teams in this matchup
      const competitors = comp.competitors || [];
      const mapped = competitors.map(t => {
        const shortName = t.team?.shortDisplayName || '';
        const displayName = t.team?.displayName || '';
        return {
          name: espnTeamMap[shortName] || espnTeamMap[displayName] || null,
          score: parseInt(t.score) || 0,
          won: t.winner === true,
        };
      });

      // Update scores for each mapped team
      mapped.forEach((m, i) => {
        if (!m.name) return;
        const oppScore = mapped[1 - i]?.score || 0;
        const prev = JSON.stringify(gameScores[m.name]);
        gameScores[m.name] = { score1: m.score, score2: oppScore, state, clock, period };
        if (JSON.stringify(gameScores[m.name]) !== prev) scoresChanged = true;

        if (isFinished) {
          const newResult = m.won ? 'won' : 'lost';
          if (results[m.name] !== newResult) {
            results[m.name] = newResult;
            resultsChanged = true;
          }
        }
      });
    });

    const liveGames = events.filter(e => {
      const s = e.competitions?.[0]?.status?.type;
      return s?.state === 'in';
    }).length;

    lastUpdated = new Date();
    const timeStr = lastUpdated.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const liveMsg = liveGames > 0 ? ` · ${liveGames} game${liveGames>1?'s':''} live` : '';
    setLiveStatus(liveGames > 0 ? 'live' : '', `Updated ${timeStr}${liveMsg}`);

    if (resultsChanged) {
      // A game finished — full rebuild to re-sort cards, update chips, etc.
      saveResults();
      render();
      renderParticipants();
      renderTerminators();
    } else if (scoresChanged) {
      // Just score/clock updates — patch in place, no flicker
      saveResults();
      updateScoresInPlace();
    }
  } catch(err) {
    setLiveStatus('error', 'Could not reach ESPN — will retry');
    console.warn('ESPN fetch error:', err);
  } finally {
    if (btn) btn.disabled = false;
  }
}

function startPolling() {
  fetchScores(); // immediate
  pollInterval = setInterval(() => fetchScores(), 60000); // every 60s
}


function openVenmo(name) {
  document.getElementById('venmo-name').textContent = name;
  document.getElementById('venmo-qr').src = VENMO_QR;
  document.getElementById('venmo-modal').classList.add('open');
}
function closeVenmo() {
  document.getElementById('venmo-modal').classList.remove('open');
}
function copyHandle() {
  navigator.clipboard.writeText(VENMO_HANDLE).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}
loadSavedResults();
render();
renderParticipants();
renderTerminators();
fetchSheetData();
startPolling();
</script>
